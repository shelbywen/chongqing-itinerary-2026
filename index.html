.form-check {

.form-check-input {

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

.form-check:not(.form-switch)

  display: block;

  height: 100%;

  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;

  height: 16px;

  transform: translate(2px, -50%);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {

  height: 20px;

}

.form-range:focus-visible::-moz-range-thumb {

.form-range:disabled {

      if (savedNotes &amp;&amp; typeof savedNotes === &quot;object&quot; &amp;&amp; !Array.isArray(savedNotes)) {
        notes = Object.fromEntries(Object.entries(savedNotes).filter(([id, value]) =&gt; validIds.has(id) &amp;&amp; typeof value === &quot;string&quot;));
      }
    } catch (_error) {
      storageAvailable = false;
    }

    const totalEvents = validIds.size;
    const panel = root.querySelector(&quot;#day-panel&quot;);
    const progressLabel = root.querySelector(&quot;#progress-label&quot;);
    const progressBar = root.querySelector(&quot;#progress-bar&quot;);
    const progressTrack = root.querySelector(&quot;.progress&quot;);
    const saveState = root.querySelector(&quot;#save-state span&quot;);

    const save = () =&gt; {
      if (!storageAvailable) return;
      try {
        localStorage.setItem(storageKey, JSON.stringify([...completed]));
        localStorage.setItem(notesKey, JSON.stringify(notes));
      } catch (_error) {
        storageAvailable = false;
        saveState.textContent = &quot;打卡和备注仅在本次打开期间保留&quot;;
      }
    };

    const dayEventIds = (dayId) =&gt; itinerary[dayId].items.filter((item) =&gt; item.type === &quot;event&quot;).map((item) =&gt; item.id);

    const escapeHtml = (value) =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (character) =&gt; ({
      &quot;&amp;&quot;: &quot;&amp;amp;&quot;,
      &quot;&lt;&quot;: &quot;&amp;lt;&quot;,
      &quot;&gt;&quot;: &quot;&amp;gt;&quot;,
      &quot;\&quot;&quot;: &quot;&amp;quot;&quot;,
      &quot;&#x27;&quot;: &quot;&amp;#039;&quot;
    })[character]);

    const renderEvent = (item) =&gt; {
      const done = completed.has(item.id);
      const note = notes[item.id] || &quot;&quot;;
      const hasNote = note.trim().length &gt; 0;
      return `
        &lt;li class=&quot;timeline-item event-item${done ? &quot; is-done&quot; : &quot;&quot;}&quot; data-event-id=&quot;${item.id}&quot; data-tone=&quot;${item.tone || &quot;activity&quot;}&quot;&gt;
          &lt;div class=&quot;time-column tabular-nums&quot;&gt;
            &lt;span class=&quot;time-start&quot;&gt;${item.start}&lt;/span&gt;
            &lt;span class=&quot;time-end text-small text-muted&quot;&gt;→ ${item.end}&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;timeline-rail&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;timeline-dot&quot;&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;event-content&quot;&gt;
            &lt;div class=&quot;event-title-row&quot;&gt;
              &lt;label class=&quot;form-check event-check&quot;&gt;
                &lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-check-id=&quot;${item.id}&quot;${done ? &quot; checked&quot; : &quot;&quot;}&gt;
                &lt;span class=&quot;form-check-label event-title&quot;&gt;${item.title}&lt;/span&gt;
              &lt;/label&gt;
              &lt;span class=&quot;viz-badge&quot;&gt;${item.kind}&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;event-meta text-small&quot;&gt;
              &lt;span&gt;&lt;i data-lucide=&quot;map-pin&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${item.venue}&lt;/span&gt;
              &lt;span&gt;&lt;i data-lucide=&quot;clock-3&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${item.duration}&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;event-address text-small text-muted&quot;&gt;${item.address}&lt;/p&gt;
            &lt;div class=&quot;event-note-row&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-note-toggle=&quot;${item.id}&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;note-${item.id}&quot;&gt;
                &lt;i data-lucide=&quot;notebook-pen&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
                &lt;span&gt;备注&lt;/span&gt;
              &lt;/button&gt;
              &lt;span class=&quot;note-indicator text-small&quot; data-note-indicator=&quot;${item.id}&quot;${hasNote ? &quot;&quot; : &quot; hidden&quot;}&gt;已记录&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;note-editor&quot; id=&quot;note-${item.id}&quot; hidden&gt;
              &lt;label class=&quot;form-label sr-only&quot; for=&quot;note-input-${item.id}&quot;&gt;${item.title}备注&lt;/label&gt;
              &lt;textarea class=&quot;form-control&quot; id=&quot;note-input-${item.id}&quot; data-note-id=&quot;${item.id}&quot; rows=&quot;2&quot; maxlength=&quot;500&quot; placeholder=&quot;记录感受、线索或提醒&quot;&gt;${escapeHtml(note)}&lt;/textarea&gt;
              &lt;p class=&quot;note-save-state text-small text-muted&quot; data-note-status=&quot;${item.id}&quot;&gt;自动保存到本机&lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/li&gt;`;
    };

    const renderMove = (item) =&gt; `
      &lt;li class=&quot;timeline-item move-item is-${item.subtype || &quot;travel&quot;}${item.risk ? &quot; is-risk&quot; : &quot;&quot;}&quot;&gt;
        &lt;div class=&quot;time-column tabular-nums${item.risk ? &quot; text-destructive&quot; : &quot;&quot;}&quot;&gt;
          &lt;span class=&quot;time-start&quot;&gt;${item.start}&lt;/span&gt;
          &lt;span class=&quot;time-end text-small${item.risk ? &quot;&quot; : &quot; text-muted&quot;}&quot;&gt;${item.end === &quot;零换场&quot; ? item.end : `→ ${item.end}`}&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;timeline-rail&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;timeline-dot&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;move-content&quot;&gt;
          &lt;div class=&quot;move-title&quot;&gt;&lt;i data-lucide=&quot;${item.icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;span class=&quot;move-action&quot;&gt;${item.label}&lt;/span&gt; · ${item.route}&lt;/span&gt;&lt;/div&gt;
          &lt;p class=&quot;move-details text-small text-muted&quot;&gt;${item.mode} · ${item.duration}&lt;/p&gt;
          &lt;p class=&quot;move-buffer text-small&quot;&gt;${item.buffer}&lt;/p&gt;
          ${item.riskOptions ? `&lt;div class=&quot;risk-options&quot;&gt;${item.riskOptions.map((option) =&gt; `&lt;div class=&quot;risk-option text-small&quot;&gt;&lt;span class=&quot;risk-option-time tabular-nums&quot;&gt;${option.time}&lt;/span&gt;&lt;span&gt;${option.text}&lt;/span&gt;&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;` : &quot;&quot;}
          ${item.note ? `&lt;p class=&quot;move-note text-small&quot;&gt;${item.note}&lt;/p&gt;` : &quot;&quot;}
        &lt;/div&gt;
      &lt;/li&gt;`;

    const updateProgress = () =&gt; {
      const doneCount = completed.size;
      const percent = totalEvents === 0 ? 0 : Math.round((doneCount / totalEvents) * 100);
      progressLabel.textContent = `${doneCount} / ${totalEvents}`;
      progressBar.style.width = `${percent}%`;
      progressTrack.setAttribute(&quot;aria-valuenow&quot;, String(doneCount));

      Object.keys(itinerary).forEach((dayId) =&gt; {
        const ids = dayEventIds(dayId);
        const dayDone = ids.filter((id) =&gt; completed.has(id)).length;
        const count = root.querySelector(`[data-day-progress=&quot;${dayId}&quot;]`);
        if (count) count.textContent = `${dayDone}/${ids.length}`;
      });
    };

    const renderDay = () =&gt; {
      const day = itinerary[selectedDay];
      const ids = dayEventIds(selectedDay);
      const dayDone = ids.filter((id) =&gt; completed.has(id)).length;
      panel.innerHTML = `
        &lt;div class=&quot;day-heading&quot;&gt;
          &lt;div&gt;
            &lt;h2&gt;${day.date} · ${day.weekday}&lt;/h2&gt;
            &lt;p class=&quot;day-subtitle text-muted&quot;&gt;${day.title} · ${day.summary}&lt;/p&gt;
          &lt;/div&gt;
          &lt;span class=&quot;day-count tabular-nums&quot;&gt;${dayDone} / ${ids.length} 已完成&lt;/span&gt;
        &lt;/div&gt;
        &lt;dl class=&quot;key-times&quot; aria-label=&quot;当日关键时间&quot;&gt;
          ${day.keyTimes.map((item) =&gt; `&lt;div class=&quot;key-time${item.risk ? &quot; is-risk&quot; : &quot;&quot;}&quot;&gt;&lt;dt class=&quot;text-small text-muted&quot;&gt;${item.label}&lt;/dt&gt;&lt;dd class=&quot;tabular-nums&quot;&gt;${item.value}&lt;/dd&gt;&lt;/div&gt;`).join(&quot;&quot;)}
        &lt;/dl&gt;
        &lt;ol class=&quot;timeline&quot; aria-label=&quot;${day.date}${day.weekday}行程时间轴&quot;&gt;
          ${day.items.map((item) =&gt; item.type === &quot;event&quot; ? renderEvent(item) : renderMove(item)).join(&quot;&quot;)}
        &lt;/ol&gt;`;

      panel.querySelectorAll(&quot;[data-check-id]&quot;).forEach((checkbox) =&gt; {
        checkbox.addEventListener(&quot;change&quot;, () =&gt; {
          const id = checkbox.getAttribute(&quot;data-check-id&quot;);
          if (checkbox.checked) completed.add(id);
          else completed.delete(id);
          save();
          renderDay();
          updateProgress();
        });
      });

      panel.querySelectorAll(&quot;[data-note-toggle]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const id = button.getAttribute(&quot;data-note-toggle&quot;);
          const editor = panel.querySelector(`#note-${id}`);
          const shouldOpen = editor.hasAttribute(&quot;hidden&quot;);
          editor.toggleAttribute(&quot;hidden&quot;, !shouldOpen);
          button.setAttribute(&quot;aria-expanded&quot;, String(shouldOpen));
          if (shouldOpen) panel.querySelector(`[data-note-id=&quot;${id}&quot;]`).focus();
        });
      });

      panel.querySelectorAll(&quot;[data-note-id]&quot;).forEach((textarea) =&gt; {
        textarea.addEventListener(&quot;input&quot;, () =&gt; {
          const id = textarea.getAttribute(&quot;data-note-id&quot;);
          if (textarea.value.trim()) notes[id] = textarea.value;
          else delete notes[id];
          save();
          const indicator = panel.querySelector(`[data-note-indicator=&quot;${id}&quot;]`);
          indicator.toggleAttribute(&quot;hidden&quot;, !textarea.value.trim());
          const status = panel.querySelector(`[data-note-status=&quot;${id}&quot;]`);
          status.textContent = storageAvailable ? &quot;已自动保存到本机&quot; : &quot;仅在本次打开期间保留&quot;;
        });
      });

      globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
    };

    root.querySelectorAll(&quot;[data-day]&quot;).forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        selectedDay = button.getAttribute(&quot;data-day&quot;);
        root.querySelectorAll(&quot;[data-day]&quot;).forEach((candidate) =&gt; {
          candidate.setAttribute(&quot;aria-pressed&quot;, String(candidate === button));
        });
        renderDay();
      });
    });

    saveState.textContent = storageAvailable ? &quot;打卡和备注自动保存在此浏览器&quot; : &quot;打卡和备注仅在本次打开期间保留&quot;;
    renderDay();
    updateProgress();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
